<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Security Headers -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://region1.google-analytics.com; base-uri 'self'; form-action 'self'; object-src 'none'; media-src 'none';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta http-equiv="Referrer-Policy" content="no-referrer">
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), autoplay=()">
    <meta http-equiv="Strict-Transport-Security" content="max-age=63072000; includeSubDomains; preload">
    
    <title>Админ-панель - TechPortal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .header h1 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 1.5rem;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 0.5rem;
        }

        .contacts-section {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 20px;
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .section-title {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            color: #667eea;
        }

        .contact-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .contact-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .contact-item.unread {
            border-left: 4px solid #667eea;
        }

        .contact-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .contact-info {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .contact-name {
            font-weight: 600;
            color: #ffffff;
        }

        .contact-email {
            color: #b0b0b0;
            font-size: 0.9rem;
        }

        .contact-date {
            color: #888;
            font-size: 0.85rem;
        }

        .contact-message {
            background: rgba(0, 0, 0, 0.3);
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            white-space: pre-wrap;
            line-height: 1.5;
            word-wrap: break-word;
            max-height: 200px;
            overflow-y: auto;
        }

        .contact-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .btn-read {
            background: #4CAF50;
            color: white;
        }

        .btn-delete {
            background: #f44336;
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: #b0b0b0;
        }

        .empty {
            text-align: center;
            padding: 3rem;
            color: #b0b0b0;
        }

        .refresh-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            margin-bottom: 2rem;
            transition: all 0.3s ease;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .error-message {
            background: rgba(244, 67, 54, 0.1);
            color: #f44336;
            padding: 1rem;
            border-radius: 10px;
            margin: 1rem 0;
            border: 1px solid rgba(244, 67, 54, 0.3);
            display: none;
        }

        /* Mobile Adaptations */
        @media (max-width: 768px) {
            .container {
                padding: var(--spacing-lg);
            }

            .contact-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.5rem;
            }

            .contact-info {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.25rem;
            }
        }

        /* Small phones */
        @media (max-width: 480px) {
            .container {
                padding: var(--spacing-md);
            }

            .admin-card {
                padding: var(--spacing-md);
            }

            h2 {
                font-size: var(--font-size-xl);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Админ-панель</h1>
            <p>Управление заявками портфолио</p>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div class="stats" id="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalContacts">-</div>
                <div>Всего заявок</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="unreadContacts">-</div>
                <div>Непрочитанных</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="todayContacts">-</div>
                <div>Сегодня</div>
            </div>
        </div>

        <!-- Telegram Section -->
        <div class="contacts-section" style="margin-bottom: 2rem;">
            <h2 class="section-title">📱 Telegram Bot</h2>
            
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem;">
                <div class="stat-card">
                    <div class="stat-number" id="telegramStatus">-</div>
                    <div>Статус бота</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="telegramBot">-</div>
                    <div>Бот</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="telegramChat">-</div>
                    <div>Чат ID</div>
                </div>
            </div>
            
            <div style="display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem;">
                <button class="refresh-btn" onclick="checkTelegramStatus()" style="margin-bottom: 0;">
                    📡 Проверить статус
                </button>
                <button class="refresh-btn" onclick="sendTestMessage()" style="margin-bottom: 0; background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);">
                    🧪 Тестовое сообщение
                </button>
                <button class="refresh-btn" onclick="sendTelegramStats()" style="margin-bottom: 0; background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
                    📊 Отправить статистику
                </button>
            </div>
            
            <div id="telegramResult" style="display: none; padding: 1rem; border-radius: 10px; margin-bottom: 1rem;"></div>
        </div>

        <!-- Email Section -->
        <div class="contacts-section" style="margin-bottom: 2rem;">
            <h2 class="section-title">📧 Email Service</h2>
            
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem;">
                <div class="stat-card">
                    <div class="stat-number" id="emailStatus">-</div>
                    <div>Статус Email</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="emailFrom">-</div>
                    <div>От кого</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="smtpHost">-</div>
                    <div>SMTP сервер</div>
                </div>
            </div>
            
            <div style="display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem;">
                <button class="refresh-btn" onclick="checkEmailStatus()" style="margin-bottom: 0;">
                    📧 Проверить статус
                </button>
                <button class="refresh-btn" onclick="showTestEmailModal()" style="margin-bottom: 0; background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);">
                    🧪 Тестовое письмо
                </button>
            </div>
            
            <div id="emailResult" style="display: none; padding: 1rem; border-radius: 10px; margin-bottom: 1rem;"></div>
        </div>

        <div class="contacts-section">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <h2 class="section-title">Заявки</h2>
                <div style="display: flex; gap: 1rem;">
                    <button class="refresh-btn" id="refreshBtn">Обновить</button>
                    <button class="refresh-btn" id="logoutBtn" style="background: #f44336;">← Выйти из админ панели</button>
                </div>
            </div>
            
            <div id="contactsList" class="loading">
                Загрузка заявок...
            </div>
        </div>
    </div>

    <script>
        let contacts = [];
        let csrfToken = '';

        // Security constants
        const SECURITY_CONFIG = {
            maxRetries: 3,
            requestTimeout: 10000,
            tokenCheckInterval: 30000,
            maxMessageLength: 5000,
            maxNameLength: 100,
            maxEmailLength: 254
        };

        // Initialize CSRF token
        async function initCSRF() {
            try {
                const response = await fetch('/api/csrf-token');
                const data = await response.json();
                if (data.csrfToken) {
                    csrfToken = data.csrfToken;
                }
            } catch (error) {
                console.warn('CSRF token fetch failed:', error);
            }
        }

        // Input sanitization - убираем только действительно опасные символы
        function sanitizeText(text) {
            if (typeof text !== 'string') return '';
            // Убираем только скрипты и потенциально опасные элементы, сохраняя русские символы
            return text
                .replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi, '')
                .replace(/javascript:/gi, '')
                .replace(/on\w+\s*=/gi, '')
                .replace(/data:/gi, '')
                .replace(/&lt;script/gi, '')
                .replace(/&lt;\/script&gt;/gi, '');
        }

        // Validate contact data
        function validateContact(contact) {
            if (!contact || typeof contact !== 'object') return false;
            
            const name = contact.name || '';
            const email = contact.email || '';
            const message = contact.message || '';
            
            if (name.length > SECURITY_CONFIG.maxNameLength) return false;
            if (email.length > SECURITY_CONFIG.maxEmailLength) return false;
            if (message.length > SECURITY_CONFIG.maxMessageLength) return false;
            
            // Email validation
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (email && !emailRegex.test(email)) return false;
            
            return true;
        }

        // Helper function to get user info from token
        // Функция декодирования русских имен (клиентская версия)
        function decodeName(name) {
            if (!name || typeof name !== 'string') return name;
            
            // Проверяем наличие испорченной кодировки (символы типа Ð³ÐµÐ¹)
            if (/[ÐÑÒÓÔÕÖØÙÚÛÜÝÞßàáâãäåæçèéêëìíîïðñòóôõöøùúûüýþÿ]/.test(name)) {
                try {
                    // Метод 1: latin1 -> utf8 декодирование
                    const bytes = new Uint8Array(name.length);
                    for (let i = 0; i < name.length; i++) {
                        bytes[i] = name.charCodeAt(i) & 0xFF;
                    }
                    let decoded = new TextDecoder('utf-8').decode(bytes);
                    
                    // Проверяем результат на валидность
                    if (/^[А-Яа-яЁё\w\s\-\.]+$/.test(decoded)) {
                        return decoded;
                    }
                    
                    // Метод 2: Словарь замен для основных проблемных случаев
                    const fixMap = {
                        'Ð³ÐµÐ¹': 'гей',
                        'ÑÐµÑÑ': 'тест',
                        'ÐÐ»ÐµÐºÑÐ°Ð½Ð´Ñ€': 'Александр',
                        'ÐÐ»ÐµÐºÑÐ°Ð½Ð´Ñ€ ÐÐµÑÑ‚Ð¾Ð²': 'Александр Тестов',
                        'ÑÐµÑÑ‚': 'тест',
                        'Ð°Ð´Ð¼Ð¸Ð½': 'админ',
                        'ÐÐ´Ð¼Ð¸Ð½': 'Админ'
                    };
                    
                    for (const [wrong, correct] of Object.entries(fixMap)) {
                        if (name.includes(wrong)) {
                            return name.replace(new RegExp(wrong.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g'), correct);
                        }
                    }
                    
                } catch (error) {
                    console.warn('Ошибка декодирования имени:', error.message);
                }
            }
            
            return name;
        }

        function getUserFromToken(token) {
            try {
                if (!token) return null;
                const payload = JSON.parse(atob(token.split('.')[1]));
                
                // Проверяем срок действия токена
                if (payload.exp && payload.exp * 1000 < Date.now()) {
                    return null;
                }
                
                let userName = payload.name || payload.email?.split('@')[0];
                
                // Применяем декодирование имени
                userName = decodeName(userName);
                
                return {
                    userId: payload.userId,
                    email: payload.email,
                    name: userName,
                    isAdmin: payload.isAdmin === true || payload.admin === true || payload.role === 'admin',
                    role: payload.role
                };
            } catch (error) {
                console.error('Error parsing token:', error);
                return null;
            }
        }

        // Check authorization on page load
        function checkAuth() {
            try {
                // Сначала проверяем новый формат токена в localStorage
                const token = localStorage.getItem('authToken');
                if (token) {
                    // Проверяем валидность токена
                    const userInfo = getUserFromToken(token);
                    if (userInfo && (userInfo.isAdmin === true || userInfo.role === 'admin')) {
                        return token;
                    } else {
                        localStorage.removeItem('authToken');
                        redirectToLogin();
                        return false;
                    }
                }
                
                // Для обратной совместимости проверяем старый формат
                const tokenStr = sessionStorage.getItem('adminToken');
                if (!tokenStr) {
                    redirectToLogin();
                    return false;
                }
                
                const tokenData = JSON.parse(tokenStr);
                if (!tokenData.token || tokenData.expires < Date.now()) {
                    sessionStorage.removeItem('adminToken');
                    redirectToLogin();
                    return false;
                }
                
                return tokenData.token;
            } catch (error) {
                localStorage.removeItem('authToken');
                sessionStorage.removeItem('adminToken');
                redirectToLogin();
                return false;
            }
        }

        // Get auth headers with CSRF protection
        function getAuthHeaders() {
            const token = checkAuth();
            if (!token) return {};
            
            const headers = {
                'Authorization': 'Bearer ' + token,
                'Content-Type': 'application/json',
                'X-Requested-With': 'XMLHttpRequest'
            };
            
            if (csrfToken) {
                headers['X-CSRF-Token'] = csrfToken;
            }
            
            return headers;
        }
        
        // Secure redirect to login
        function redirectToLogin() {
            window.location.replace('/login.html');
        }

        // Logout function (полный выход из аккаунта)
        function logout() {
            localStorage.removeItem('authToken');
            sessionStorage.removeItem('adminToken');
            sessionStorage.clear();
            window.location.replace('/login.html');
        }
        
        // Exit admin panel function (только выход из админ панели)
        function exitAdminPanel() {
            if (confirm('Выйти из админ панели?')) {
                // Очищаем только админские токены и состояние
                sessionStorage.removeItem('adminToken');
                sessionStorage.removeItem('redirectCount');
                
                // НЕ удаляем authToken - пользователь остается залогиненным
                window.location.replace('/');
            }
        }

        // Telegram functions
        async function checkTelegramStatus() {
            const token = checkAuth();
            if (!token) return;
            
            try {
                const response = await fetch('/api/admin/telegram/status', {
                    headers: getAuthHeaders()
                });

                if (response.status === 401) {
                    logout();
                    return;
                }

                const data = await response.json();
                
                if (data.success) {
                    const telegram = data.telegram;
                    
                    // Update status indicators
                    document.getElementById('telegramStatus').textContent = telegram.enabled ? '✅ Активен' : '❌ Отключен';
                    document.getElementById('telegramBot').textContent = telegram.botInfo ? telegram.botInfo.username : 'Не настроен';
                    document.getElementById('telegramChat').textContent = telegram.adminChatId || 'Не настроен';
                    
                    showTelegramResult(telegram.enabled ? 'Telegram Bot активен и готов к работе' : 'Telegram Bot не настроен', 'success');
                } else {
                    showTelegramResult('Ошибка получения статуса Telegram', 'error');
                }
            } catch (error) {
                console.error('Ошибка:', error);
                showTelegramResult('Ошибка подключения к серверу', 'error');
            }
        }

        async function sendTestMessage() {
            const token = checkAuth();
            if (!token) return;
            
            try {
                const response = await fetch('/api/admin/telegram/test', {
                    method: 'POST',
                    headers: getAuthHeaders()
                });

                if (response.status === 401) {
                    logout();
                    return;
                }

                const data = await response.json();
                
                if (data.success) {
                    showTelegramResult('Тестовое сообщение успешно отправлено в Telegram!', 'success');
                } else {
                    showTelegramResult(data.message || 'Ошибка отправки тестового сообщения', 'error');
                }
            } catch (error) {
                console.error('Ошибка:', error);
                showTelegramResult('Ошибка подключения к серверу', 'error');
            }
        }

        async function sendTelegramStats() {
            const token = checkAuth();
            if (!token) return;
            
            try {
                const response = await fetch('/api/admin/telegram/stats', {
                    method: 'POST',
                    headers: getAuthHeaders()
                });

                if (response.status === 401) {
                    logout();
                    return;
                }

                const data = await response.json();
                
                if (data.success) {
                    showTelegramResult('Статистика успешно отправлена в Telegram!', 'success');
                } else {
                    showTelegramResult(data.message || 'Ошибка отправки статистики', 'error');
                }
            } catch (error) {
                console.error('Ошибка:', error);
                showTelegramResult('Ошибка подключения к серверу', 'error');
            }
        }

        function showTelegramResult(message, type) {
            const resultEl = document.getElementById('telegramResult');
            resultEl.textContent = sanitizeText(message);
            resultEl.style.display = 'block';
            
            if (type === 'success') {
                resultEl.style.background = 'rgba(76, 175, 80, 0.1)';
                resultEl.style.color = '#4CAF50';
                resultEl.style.border = '1px solid rgba(76, 175, 80, 0.3)';
            } else {
                resultEl.style.background = 'rgba(244, 67, 54, 0.1)';
                resultEl.style.color = '#f44336';
                resultEl.style.border = '1px solid rgba(244, 67, 54, 0.3)';
            }
            
            // Auto-hide after 5 seconds
            setTimeout(() => {
                resultEl.style.display = 'none';
            }, 5000);
        }

        // Email functions
        async function checkEmailStatus() {
            const token = checkAuth();
            if (!token) return;
            
            try {
                const response = await fetch('/api/admin/email/status', {
                    headers: getAuthHeaders()
                });

                if (response.status === 401) {
                    logout();
                    return;
                }

                const data = await response.json();
                
                if (data.success) {
                    const email = data.email;
                    
                    // Update status indicators
                    document.getElementById('emailStatus').textContent = email.enabled ? '✅ Активен' : '❌ Отключен';
                    document.getElementById('emailFrom').textContent = email.fromEmail || 'Не настроен';
                    document.getElementById('smtpHost').textContent = email.smtpHost || 'Не настроен';
                    
                    showEmailResult(email.enabled ? 'Email сервис активен и готов к работе' : 'Email сервис не настроен', email.enabled ? 'success' : 'error');
                } else {
                    showEmailResult('Ошибка получения статуса Email', 'error');
                }
            } catch (error) {
                console.error('Ошибка:', error);
                showEmailResult('Ошибка подключения к серверу', 'error');
            }
        }

        function showTestEmailModal() {
            const existingModal = document.querySelector('.test-email-modal');
            if (existingModal) {
                existingModal.remove();
            }
            
            const overlay = document.createElement('div');
            overlay.className = 'test-email-modal';
            overlay.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.7);
                z-index: 50000;
                display: flex;
                align-items: center;
                justify-content: center;
            `;
            
            const modal = document.createElement('div');
            modal.style.cssText = `
                background: #1a1a1a;
                padding: 2rem;
                border-radius: 15px;
                max-width: 400px;
                width: 90%;
                border: 1px solid #333;
            `;
            
            const title = document.createElement('h3');
            title.textContent = 'Отправить тестовое письмо';
            title.style.cssText = 'color: white; margin-bottom: 1rem; text-align: center;';
            
            const emailInput = document.createElement('input');
            emailInput.type = 'email';
            emailInput.placeholder = 'Введите email адрес';
            emailInput.style.cssText = `
                width: 100%;
                padding: 0.75rem;
                border: 1px solid #333;
                border-radius: 8px;
                background: #2a2a2a;
                color: white;
                margin-bottom: 1rem;
                box-sizing: border-box;
            `;
            
            const buttonsContainer = document.createElement('div');
            buttonsContainer.style.cssText = 'display: flex; gap: 1rem; justify-content: center;';
            
            const cancelBtn = document.createElement('button');
            cancelBtn.textContent = 'Отмена';
            cancelBtn.className = 'btn';
            cancelBtn.style.cssText = 'background: #666; color: white;';
            
            const sendBtn = document.createElement('button');
            sendBtn.textContent = 'Отправить';
            sendBtn.className = 'btn';
            sendBtn.style.cssText = 'background: #43e97b; color: white;';
            
            cancelBtn.addEventListener('click', () => overlay.remove());
            
            sendBtn.addEventListener('click', async () => {
                const email = emailInput.value.trim();
                if (!email) {
                    alert('Введите email адрес');
                    return;
                }
                
                sendBtn.disabled = true;
                sendBtn.textContent = 'Отправляем...';
                
                try {
                    const response = await fetch('/api/admin/email/test', {
                        method: 'POST',
                        headers: getAuthHeaders(),
                        body: JSON.stringify({ email })
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        showEmailResult('Тестовое письмо успешно отправлено!', 'success');
                        overlay.remove();
                    } else {
                        showEmailResult(data.message || 'Ошибка отправки тестового письма', 'error');
                    }
                } catch (error) {
                    console.error('Ошибка:', error);
                    showEmailResult('Ошибка подключения к серверу', 'error');
                } finally {
                    sendBtn.disabled = false;
                    sendBtn.textContent = 'Отправить';
                }
            });
            
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) overlay.remove();
            });
            
            buttonsContainer.appendChild(cancelBtn);
            buttonsContainer.appendChild(sendBtn);
            modal.appendChild(title);
            modal.appendChild(emailInput);
            modal.appendChild(buttonsContainer);
            overlay.appendChild(modal);
            document.body.appendChild(overlay);
            
            emailInput.focus();
        }

        function showEmailResult(message, type) {
            const resultEl = document.getElementById('emailResult');
            resultEl.textContent = sanitizeText(message);
            resultEl.style.display = 'block';
            
            if (type === 'success') {
                resultEl.style.background = 'rgba(76, 175, 80, 0.1)';
                resultEl.style.color = '#4CAF50';
                resultEl.style.border = '1px solid rgba(76, 175, 80, 0.3)';
            } else {
                resultEl.style.background = 'rgba(244, 67, 54, 0.1)';
                resultEl.style.color = '#f44336';
                resultEl.style.border = '1px solid rgba(244, 67, 54, 0.3)';
            }
            
            // Auto-hide after 5 seconds
            setTimeout(() => {
                resultEl.style.display = 'none';
            }, 5000);
        }

        // Reply modal
        function showReplyModal(contact) {
            const existingModal = document.querySelector('.reply-modal');
            if (existingModal) {
                existingModal.remove();
            }
            
            const overlay = document.createElement('div');
            overlay.className = 'reply-modal';
            overlay.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.7);
                z-index: 50000;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 1rem;
            `;
            
            const modal = document.createElement('div');
            modal.style.cssText = `
                background: #1a1a1a;
                padding: 2rem;
                border-radius: 15px;
                max-width: 600px;
                width: 100%;
                max-height: 80vh;
                overflow-y: auto;
                border: 1px solid #333;
            `;
            
            const title = document.createElement('h3');
            title.textContent = `Ответить: ${contact.name}`;
            title.style.cssText = 'color: white; margin-bottom: 1rem;';
            
            const emailInfo = document.createElement('p');
            emailInfo.textContent = `Email: ${contact.email}`;
            emailInfo.style.cssText = 'color: #b0b0b0; margin-bottom: 1rem; font-size: 0.9rem;';
            
            const originalMessage = document.createElement('div');
            originalMessage.style.cssText = `
                background: #2a2a2a;
                padding: 1rem;
                border-radius: 8px;
                margin-bottom: 1rem;
                border-left: 4px solid #667eea;
            `;
            originalMessage.innerHTML = `
                <strong style="color: #667eea;">Исходное сообщение:</strong><br>
                <span style="color: #b0b0b0; font-size: 0.85rem;">${formatDate(contact.createdAt)}</span><br><br>
                ${sanitizeText(contact.message).replace(/\n/g, '<br>')}
            `;
            
            const subjectInput = document.createElement('input');
            subjectInput.type = 'text';
            subjectInput.placeholder = 'Тема письма';
            subjectInput.value = `Re: Сообщение от ${contact.name}`;
            subjectInput.style.cssText = `
                width: 100%;
                padding: 0.75rem;
                border: 1px solid #333;
                border-radius: 8px;
                background: #2a2a2a;
                color: white;
                margin-bottom: 1rem;
                box-sizing: border-box;
            `;
            
            const messageTextarea = document.createElement('textarea');
            messageTextarea.placeholder = 'Ваш ответ...';
            messageTextarea.rows = 8;
            messageTextarea.style.cssText = `
                width: 100%;
                padding: 0.75rem;
                border: 1px solid #333;
                border-radius: 8px;
                background: #2a2a2a;
                color: white;
                margin-bottom: 1rem;
                box-sizing: border-box;
                resize: vertical;
                font-family: inherit;
            `;
            
            const charCounter = document.createElement('div');
            charCounter.style.cssText = 'color: #888; font-size: 0.8rem; margin-bottom: 1rem; text-align: right;';
            
            messageTextarea.addEventListener('input', () => {
                const length = messageTextarea.value.length;
                charCounter.textContent = `${length}/5000 символов`;
                charCounter.style.color = length > 4500 ? '#f44336' : '#888';
            });
            
            const buttonsContainer = document.createElement('div');
            buttonsContainer.style.cssText = 'display: flex; gap: 1rem; justify-content: flex-end;';
            
            const cancelBtn = document.createElement('button');
            cancelBtn.textContent = 'Отмена';
            cancelBtn.className = 'btn';
            cancelBtn.style.cssText = 'background: #666; color: white;';
            
            const sendBtn = document.createElement('button');
            sendBtn.textContent = 'Отправить ответ';
            sendBtn.className = 'btn';
            sendBtn.style.cssText = 'background: #2196F3; color: white;';
            
            cancelBtn.addEventListener('click', () => overlay.remove());
            
            sendBtn.addEventListener('click', async () => {
                const subject = subjectInput.value.trim();
                const message = messageTextarea.value.trim();
                
                if (!subject || !message) {
                    alert('Заполните тему и сообщение');
                    return;
                }
                
                if (message.length > 5000) {
                    alert('Сообщение слишком длинное (максимум 5000 символов)');
                    return;
                }
                
                sendBtn.disabled = true;
                sendBtn.textContent = 'Отправляем...';
                
                try {
                    const response = await fetch(`/api/admin/contacts/${contact.id}/reply`, {
                        method: 'POST',
                        headers: getAuthHeaders(),
                        body: JSON.stringify({ subject, message })
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        showEmailResult('Ответ успешно отправлен!', 'success');
                        overlay.remove();
                        
                        // Обновляем список контактов
                        loadContacts();
                    } else {
                        alert(data.message || 'Ошибка отправки ответа');
                    }
                } catch (error) {
                    console.error('Ошибка:', error);
                    alert('Ошибка подключения к серверу');
                } finally {
                    sendBtn.disabled = false;
                    sendBtn.textContent = 'Отправить ответ';
                }
            });
            
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) overlay.remove();
            });
            
            const escapeHandler = (e) => {
                if (e.key === 'Escape') {
                    document.removeEventListener('keydown', escapeHandler);
                    overlay.remove();
                }
            };
            document.addEventListener('keydown', escapeHandler);
            
            buttonsContainer.appendChild(cancelBtn);
            buttonsContainer.appendChild(sendBtn);
            modal.appendChild(title);
            modal.appendChild(emailInfo);
            modal.appendChild(originalMessage);
            modal.appendChild(subjectInput);
            modal.appendChild(messageTextarea);
            modal.appendChild(charCounter);
            modal.appendChild(buttonsContainer);
            overlay.appendChild(modal);
            document.body.appendChild(overlay);
            
            messageTextarea.focus();
            messageTextarea.dispatchEvent(new Event('input')); // Trigger char counter
        }

        // Show error message
        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = sanitizeText(message);
            errorEl.style.display = 'block';
            
            // Auto-hide after 5 seconds
            setTimeout(() => {
                errorEl.style.display = 'none';
            }, 5000);
        }

        async function loadContacts() {
            const token = checkAuth();
            if (!token) return;
            
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), SECURITY_CONFIG.requestTimeout);
                
                const response = await fetch('/api/admin/contacts', {
                    headers: getAuthHeaders(),
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);

                if (response.status === 401) {
                    logout();
                    return;
                }

                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                const data = await response.json();

                if (data.success && Array.isArray(data.contacts)) {
                    // Validate all contacts
                    contacts = data.contacts.filter(validateContact);
                    updateStats();
                    renderContacts();
                } else {
                    showError('Ошибка загрузки заявок');
                }
            } catch (error) {
                if (error.name === 'AbortError') {
                    showError('Превышено время ожидания');
                } else {
                console.error('Ошибка:', error);
                    showError('Ошибка подключения к серверу');
                }
            }
        }

        function updateStats() {
            const total = contacts.length;
            const unread = contacts.filter(c => !c.is_read).length;
            const today = contacts.filter(c => {
                const today = new Date().toDateString();
                const contactDate = new Date(c.createdAt).toDateString();
                return today === contactDate;
            }).length;

            // Safely update text content
            document.getElementById('totalContacts').textContent = String(total);
            document.getElementById('unreadContacts').textContent = String(unread);
            document.getElementById('todayContacts').textContent = String(today);
        }

        function renderContacts() {
            const container = document.getElementById('contactsList');

            if (contacts.length === 0) {
                container.textContent = 'Заявок пока нет';
                container.className = 'empty';
                return;
            }

            // Clear container safely
            container.innerHTML = '';
            container.className = '';
            
            contacts.forEach(contact => {
                const contactDiv = document.createElement('div');
                contactDiv.className = 'contact-item' + (!contact.is_read ? ' unread' : '');
                contactDiv.setAttribute('data-contact-id', contact.id);
                
                // Header
                const headerDiv = document.createElement('div');
                headerDiv.className = 'contact-header';
                
                const infoDiv = document.createElement('div');
                infoDiv.className = 'contact-info';
                
                const nameDiv = document.createElement('div');
                nameDiv.className = 'contact-name';
                nameDiv.textContent = sanitizeText(contact.name || 'Без имени');
                
                const emailDiv = document.createElement('div');
                emailDiv.className = 'contact-email';
                emailDiv.textContent = sanitizeText(contact.email || 'Без email');
                
                const dateDiv = document.createElement('div');
                dateDiv.className = 'contact-date';
                dateDiv.textContent = formatDate(contact.createdAt);
                
                infoDiv.appendChild(nameDiv);
                infoDiv.appendChild(emailDiv);
                headerDiv.appendChild(infoDiv);
                headerDiv.appendChild(dateDiv);
                
                // Message
                const messageDiv = document.createElement('div');
                messageDiv.className = 'contact-message';
                messageDiv.textContent = sanitizeText(contact.message || 'Нет сообщения');
                
                // Actions
                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'contact-actions';
                
                if (!contact.is_read) {
                    const readBtn = document.createElement('button');
                    readBtn.className = 'btn btn-read';
                    readBtn.textContent = 'Отметить прочитанным';
                    readBtn.setAttribute('data-action', 'read');
                    readBtn.setAttribute('data-contact-id', contact.id);
                    actionsDiv.appendChild(readBtn);
                } else {
                    const readSpan = document.createElement('span');
                    readSpan.style.cssText = 'color: #4CAF50; font-size: 0.85rem;';
                    readSpan.textContent = '✓ Прочитано';
                    actionsDiv.appendChild(readSpan);
                }
                
                const replyBtn = document.createElement('button');
                replyBtn.className = 'btn';
                replyBtn.style.cssText = 'background: #2196F3; color: white;';
                replyBtn.textContent = 'Ответить';
                replyBtn.setAttribute('data-action', 'reply');
                replyBtn.setAttribute('data-contact-id', contact.id);
                actionsDiv.appendChild(replyBtn);
                
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'btn btn-delete';
                deleteBtn.textContent = 'Удалить';
                deleteBtn.setAttribute('data-action', 'delete');
                deleteBtn.setAttribute('data-contact-id', contact.id);
                actionsDiv.appendChild(deleteBtn);
                
                contactDiv.appendChild(headerDiv);
                contactDiv.appendChild(messageDiv);
                contactDiv.appendChild(actionsDiv);
                
                container.appendChild(contactDiv);
            });
        }

        async function markAsRead(contactId) {
            if (!contactId) return false;
            const contactIdNum = Number(contactId);
            
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), SECURITY_CONFIG.requestTimeout);
                
                const response = await fetch('/api/admin/contacts/' + encodeURIComponent(contactId) + '/read', {
                    method: 'PATCH',
                    headers: getAuthHeaders(),
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);

                if (response.ok) {
                    const contact = contacts.find(c => Number(c.id) === contactIdNum);
                    if (contact) {
                        contact.is_read = true;
                        updateStats();
                        renderContacts();
                    }
                    return true;
                }
            } catch (error) {
                if (error.name !== 'AbortError') {
                console.error('Ошибка отметки как прочитанное:', error);
                }
                showError('Ошибка при обновлении статуса');
            }
            return false;
        }

        async function deleteContact(contactId) {
            if (!contactId) return false;
            const contactIdNum = Number(contactId);
            
            if (!await showSecureConfirm('Вы уверены, что хотите удалить эту заявку?')) {
                return false;
            }

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), SECURITY_CONFIG.requestTimeout);
                
                const response = await fetch('/api/admin/contacts/' + encodeURIComponent(contactId), {
                    method: 'DELETE',
                    headers: getAuthHeaders(),
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);

                if (response.ok) {
                    contacts = contacts.filter(c => Number(c.id) !== contactIdNum);
                    updateStats();
                    renderContacts();
                    return true;
                }
            } catch (error) {
                if (error.name !== 'AbortError') {
                console.error('Ошибка удаления:', error);
                }
                showError('Ошибка при удалении заявки');
            }
            return false;
        }

        function formatDate(dateString) {
            try {
            const date = new Date(dateString);
                if (isNaN(date.getTime())) return 'Неверная дата';
                
            return date.toLocaleString('ru-RU', {
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
            } catch (error) {
                return 'Неверная дата';
            }
        }

        // Event delegation for contact actions
        document.addEventListener('click', async function(event) {
            const target = event.target;
            
            if (target.hasAttribute('data-action')) {
                event.preventDefault();
                const action = target.getAttribute('data-action');
                const contactId = target.getAttribute('data-contact-id');
                
                if (!contactId) return;
                
                if (action === 'read') {
                    target.disabled = true;
                    target.textContent = 'Обновляем...';
                    await markAsRead(contactId);
                } else if (action === 'reply') {
                    const contact = contacts.find(c => Number(c.id) === Number(contactId));
                    if (contact) {
                        showReplyModal(contact);
                    }
                } else if (action === 'delete') {
                    target.disabled = true;
                    const originalText = target.textContent;
                    target.textContent = 'Удаляем...';
                    const success = await deleteContact(contactId);
                    if (!success) {
                        target.disabled = false;
                        target.textContent = originalText;
                    }
                }
            }
        });

        // Page visibility and activity tracking
        let isPageVisible = true;
        let lastActivity = Date.now();
        
        document.addEventListener('visibilitychange', () => {
            isPageVisible = !document.hidden;
        });
        
        document.addEventListener('mousemove', () => {
            lastActivity = Date.now();
        });
        
        document.addEventListener('keydown', () => {
            lastActivity = Date.now();
        });
        
        // Secure auto-refresh with activity checks
        function secureAutoRefresh() {
            const fiveMinutes = 5 * 60 * 1000;
            if (isPageVisible && (Date.now() - lastActivity < fiveMinutes)) {
                loadContacts();
            }
        }

        // Event listeners
        document.getElementById('refreshBtn').addEventListener('click', loadContacts);
        document.getElementById('logoutBtn').addEventListener('click', exitAdminPanel);

        // Secure confirm dialog
        function showSecureConfirm(message) {
            return new Promise((resolve) => {
                const existingDialog = document.querySelector('.secure-confirm-dialog');
                if (existingDialog) {
                    existingDialog.remove();
                }
                
                const overlay = document.createElement('div');
                overlay.className = 'secure-confirm-overlay';
                overlay.style.cssText = `
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    background: rgba(0, 0, 0, 0.7);
                    z-index: 50000;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                `;
                
                const dialog = document.createElement('div');
                dialog.className = 'secure-confirm-dialog';
                dialog.style.cssText = `
                    background: #1a1a1a;
                    padding: 2rem;
                    border-radius: 15px;
                    max-width: 400px;
                    margin: 1rem;
                    text-align: center;
                    border: 1px solid #333;
                `;
                
                const messageEl = document.createElement('p');
                messageEl.textContent = sanitizeText(message);
                messageEl.style.cssText = `
                    color: white;
                    margin-bottom: 2rem;
                    font-size: 1.1rem;
                `;
                
                const buttonsContainer = document.createElement('div');
                buttonsContainer.style.cssText = `
                    display: flex;
                    gap: 1rem;
                    justify-content: center;
                `;
                
                const cancelBtn = document.createElement('button');
                cancelBtn.textContent = 'Отмена';
                cancelBtn.style.cssText = `
                    padding: 0.75rem 1.5rem;
                    border: 1px solid #666;
                    background: transparent;
                    color: white;
                    border-radius: 8px;
                    cursor: pointer;
                `;
                
                const confirmBtn = document.createElement('button');
                confirmBtn.textContent = 'Удалить';
                confirmBtn.style.cssText = `
                    padding: 0.75rem 1.5rem;
                    border: none;
                    background: #f44336;
                    color: white;
                    border-radius: 8px;
                    cursor: pointer;
                `;
                
                cancelBtn.addEventListener('click', () => {
                    overlay.remove();
                    resolve(false);
                });
                
                confirmBtn.addEventListener('click', () => {
                    overlay.remove();
                    resolve(true);
                });
                
                overlay.addEventListener('click', (e) => {
                    if (e.target === overlay) {
                        overlay.remove();
                        resolve(false);
                    }
                });
                
                const escapeHandler = (e) => {
                    if (e.key === 'Escape') {
                        document.removeEventListener('keydown', escapeHandler);
                        overlay.remove();
                        resolve(false);
                    }
                };
                document.addEventListener('keydown', escapeHandler);
                
                buttonsContainer.appendChild(cancelBtn);
                buttonsContainer.appendChild(confirmBtn);
                dialog.appendChild(messageEl);
                dialog.appendChild(buttonsContainer);
                overlay.appendChild(dialog);
                document.body.appendChild(overlay);
                
                cancelBtn.focus();
            });
        }

        // Initialize page
        window.addEventListener('load', async () => {
            await initCSRF();
            loadContacts();
            // Load status on page load
            setTimeout(() => {
                checkTelegramStatus();
                checkEmailStatus();
            }, 1000);
        });

        // Auto-refresh every 30 seconds with security checks
        setInterval(secureAutoRefresh, 30000);

        // Token validity check every 30 seconds
        setInterval(() => {
            if (!checkAuth()) {
                logout();
            }
        }, SECURITY_CONFIG.tokenCheckInterval);
    </script>
</body>
